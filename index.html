<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anibis 戰略監控沙盤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .card { cursor: grab; transition: transform 0.2s; }
        .card:active { cursor: grabbing; transform: scale(1.05); }
        .ghost { opacity: 0.5; background: #334155; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-blue-400">Anibis 核心監控系統 <span class="text-sm font-normal text-slate-500">v1.0</span></h1>
            <div class="flex gap-4">
                <div class="glass px-4 py-2 rounded-lg text-sm">
                    狀態: <span class="text-green-400">運作中</span>
                </div>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Column 1: System Status -->
            <div class="flex flex-col gap-6">
                <div class="glass p-6 rounded-2xl">
                    <h2 class="text-xl font-semibold mb-4 border-b border-slate-700 pb-2">系統狀態</h2>
                    <div class="space-y-4">
                        <div>
                            <div class="flex justify-between text-sm mb-1">
                                <span>Token 使用量 (gemini-3-flash)</span>
                                <span id="token-percent-text">--%</span>
                            </div>
                            <div class="w-full bg-slate-700 rounded-full h-2">
                                <div id="token-bar" class="bg-blue-500 h-2 rounded-full" style="width: 0%"></div>
                            </div>
                        </div>
                        <div class="text-sm text-slate-400">
                            <p>GitHub 連線: <span id="github-status" class="text-green-400">檢查中...</span></p>
                            <p>最後更新: <span id="last-sync" class="text-slate-500 text-xs">--</span></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Column 2: Active Projects -->
            <div class="glass p-6 rounded-2xl">
                <h2 class="text-xl font-semibold mb-4 border-b border-slate-700 pb-2">當前專案</h2>
                <div id="active-list" class="space-y-3 min-h-[200px]">
                    <div class="card glass p-4 rounded-xl border-l-4 border-blue-500">
                        <h3 class="font-bold">Anibis-Soul-Sync</h3>
                        <p class="text-xs text-slate-400">自動備份記憶與設定至 GitHub</p>
                    </div>
                </div>
            </div>

            <!-- Column 3: Idea Zone -->
            <div class="glass p-6 rounded-2xl bg-slate-800/50">
                <h2 class="text-xl font-semibold mb-4 border-b border-slate-700 pb-2 text-yellow-500">Idea 靈感區</h2>
                <div id="idea-list" class="space-y-3 min-h-[200px]">
                    <div class="card glass p-4 rounded-xl border-l-4 border-yellow-500">
                        <h3 class="font-bold">GitHub 全自動獵人</h3>
                        <p class="text-xs text-slate-400">自動搜尋並報告新技能與熱門專案</p>
                    </div>
                    <div class="card glass p-4 rounded-xl border-l-4 border-purple-500">
                        <h3 class="font-bold">全自動程式碼工坊</h3>
                        <p class="text-xs text-slate-400">根據構想自動建立專案並發起 PR</p>
                    </div>
                </div>
            </div>

        </div>

        <footer class="mt-12 text-center text-slate-600 text-xs">
            主公大人尊用 · 忠誠助手 Anibis 構建
        </footer>
    </div>

    <script>
        const activeList = document.getElementById('active-list');
        const ideaList = document.getElementById('idea-list');

        new Sortable(activeList, {
            group: 'shared',
            animation: 150,
            ghostClass: 'ghost'
        });

        new Sortable(ideaList, {
            group: 'shared',
            animation: 150,
            ghostClass: 'ghost'
        });

        // Fetch Dynamic Status
        async function updateStatus() {
            try {
                const response = await fetch('./status.json');
                const data = await response.json();
                document.getElementById('token-percent-text').innerText = data.tokenUsed + '%';
                document.getElementById('token-bar').style.width = data.tokenUsed + '%';
                document.getElementById('github-status').innerText = data.githubStatus;
                document.getElementById('last-sync').innerText = data.lastSync;
            } catch (e) {
                console.error("Failed to fetch status", e);
            }
        }
        updateStatus();
        setInterval(updateStatus, 60000);
    </script>
</body>
</html>
